<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | SPARC</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo"><img src="source/logos/sparc-logo.png" alt="SPARC"></a>
            <ul class="nav-links">
                <li><a href="index.html" data-key="nav_home">Home</a></li>
                <li><a href="index.html#about" data-key="nav_about">About SPARC</a></li>
                <li><a href="projects.html" data-key="nav_projects">Projects</a></li>
                <li><a href="people.html" data-key="nav_people">People</a></li>
                <li><a href="index.html#contact" data-key="nav_contact">Contact Us</a></li>
            </ul>
            <div class="lang-switch">
                <button id="theme-toggle" aria-label="Toggle Theme">🌙</button>
                <button class="lang-btn active" data-lang="en" onclick="switchLang('en')">EN</button>
                <button class="lang-btn" data-lang="nl" onclick="switchLang('nl')">NL</button>
            </div>
        </div>
    </nav>

    <main style="padding-top: 120px; padding-bottom: 80px;">
        <div class="container">
            <a href="projects.html" style="color: var(--primary-cyan); text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 2rem;">&larr; Back to Projects</a>
            
            <h1 id="project-title" style="margin-bottom: 1.5rem; font-size: 2.5rem; line-height: 1.2;"></h1>
            <p id="project-desc" style="color: var(--text-gray); font-size: 1.15rem; margin-bottom: 3rem; line-height: 1.6;"></p>
            
            <!-- Project image -->
            <img id="project-image" style="width: 100%; max-height: 600px; object-fit: contain; margin-bottom: 2rem; border-radius: 12px; display: none;">
            
            <!-- Extended details -->
            <div class="glass-card" style="min-height: 300px; padding: 3rem;">
                <h3 style="color: var(--text-main); margin-bottom: 1rem;" data-key="project_details_title">Project Details</h3>                <div id="project-details" class="markdown-body">
                    <p style="color: var(--text-gray);"><em>Detailed information, methodologies, and outcomes for this project will be added here soon...</em></p>
                </div>
                
                <!-- External Resources Container -->
                <div id="external-resources" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(128, 128, 128, 0.2); display: none;">
                </div>            </div>
        </div>
    </main>

    <footer>
        <div class="container text-center">
            <p data-key="footer_partners">Partners</p>
            <div class="partner-logos">
                <img src="source/logos/tudelft-logo.png" alt="TU Delft">
                <img src="source/logos/erasmus-logo.png" alt="Erasmus University">
                <img src="source/logos/rotterdam-logo.png" alt="Gemeente Rotterdam">
                <img src="source/logos/convergence-logo.png" alt="Convergence" style="height: 50px;">
            </div>
            <p style="margin-top: 3rem; color: var(--text-gray); font-size: 0.8rem;">&copy; 2026 SPARC. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Load project data from JSON
        (function() {
            var params = new URLSearchParams(window.location.search);
            var projectId = params.get("id");
            if (!projectId) { window.location.href = "projects.html"; return; }

            fetch("source/projects/projects.json")
                .then(function(r) { return r.json(); })
                .then(function(projects) {
                    var project = null;
                    for (var i = 0; i < projects.length; i++) {
                        if (projects[i].id === projectId) { project = projects[i]; break; }
                    }
                    if (!project) { window.location.href = "projects.html"; return; }

                    var lang = localStorage.getItem("sparc_lang") || "en";

                    function renderProject() {
                        lang = localStorage.getItem("sparc_lang") || "en";
                        document.getElementById("project-title").textContent = project["title_" + lang];
                        // document.getElementById("project-desc").textContent = project["desc_" + lang];
                        document.title = project["title_" + lang] + " | SPARC";

                        // Handle external resources
                        var extRes = document.getElementById("external-resources");
                        if (project.paper_url && project.paper_url.trim() !== "") {
                            var titleRes = lang === 'en' ? 'External Resources' : 'Externe Bronnen';
                            var descText = lang === 'en' ? 'If you want to dive deeper into the methodology and detailed results, you can access the full scientific publication below:' : 'Als u meer wilt weten over de methodologie en de gedetailleerde resultaten, kunt u hieronder de volledige wetenschappelijke publicatie raadplegen:';
                            var btnText = lang === 'en' ? 'Read Full Paper' : 'Lees het volledige onderzoek';
                            
                            extRes.innerHTML = '<h3 style="color: var(--primary-cyan); font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 700;">' + titleRes + '</h3>' +
                                               '<p style="color: var(--text-gray); margin-bottom: 1.5rem; line-height: 1.6; font-size: 1.05rem;">' + descText + '</p>' +
                                               '<a href="' + project.paper_url + '" target="_blank" style="display: inline-block; padding: 12px 24px; background-color: var(--primary-cyan); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; transition: opacity 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">🔗 ' + btnText + '</a>';
                            extRes.style.display = "block";
                        } else {
                            extRes.style.display = "none";
                        }

                        
                        // Fetch the details markdown file
                        var mdFile = "source/projects/" + projectId + "/details_" + lang + ".md";
                        fetch(mdFile)
                            .then(function(response) {
                                if (response.ok) return response.text();
                                throw new Error("Details not found");
                            })
                            .then(function(text) {
                                document.getElementById("project-details").innerHTML = marked.parse(text);
                            })
                            .catch(function(error) {
                                document.getElementById("project-details").innerHTML = "<p><em>Details coming soon...</em></p>";
                            });
                    }

                    renderProject();

                    // Check for project-specific image
                    var img = new Image();
                    img.onload = function() {
                        var el = document.getElementById("project-image");
                        el.src = img.src;
                        el.style.display = "block";
                    };
                    img.src = "source/projects/" + projectId + "/image.png";

                    // Override switchLang to also update project content
                    var originalSwitchLang = window.switchLang;
                    window.switchLang = function(l) {
                        originalSwitchLang(l);
                        renderProject();
                    };
                });
        })();
    </script>
</body>
</html>
