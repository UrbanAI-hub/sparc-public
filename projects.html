<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | SPARC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo"><img src="source/logos/sparc-logo.png" alt="SPARC"></a>
            <ul class="nav-links">
                <li><a href="index.html" data-key="nav_home">Home</a></li>
                <li><a href="index.html#about" data-key="nav_about">About SPARC</a></li>
                <li><a href="projects.html" data-key="nav_projects">Projects</a></li>
                <li><a href="people.html" data-key="nav_people">People</a></li>
                <li><a href="index.html#contact" data-key="nav_contact">Contact Us</a></li>
            </ul>
            <div class="lang-switch">
                <button id="theme-toggle" aria-label="Toggle Theme">🌙</button>
                <button class="lang-btn active" data-lang="en" onclick="switchLang('en')">EN</button>
                <button class="lang-btn" data-lang="nl" onclick="switchLang('nl')">NL</button>
            </div>
        </div>
    </nav>

    <main style="padding-top: 120px; padding-bottom: 80px;">
        <section class="container">
            <h2 class="section-title" data-key="projects_title">Projects</h2>
            <p style="text-align: center; color: var(--text-gray); margin-bottom: 3rem;" data-key="projects_subtitle">Discover our ongoing AI initiatives within the Rotterdam municipality.</p>

            
            <div style="margin-top: 2rem; margin-bottom: 3rem; text-align: center;">
                <h3 style="font-family: 'Inter', sans-serif; font-size: 2rem; color: var(--text-main);"><span data-key="projects_completed">Completed Projects</span></h3>
            </div>
            <div id="projects-grid-completed" style="display: flex; flex-direction: column; gap: 3rem; margin-bottom: 5rem;">
                <!-- Projects loaded dynamically from projects.json -->
            </div>

            <div style="margin-top: 6rem; margin-bottom: 3rem; text-align: center;">
                <h3 style="font-family: 'Inter', sans-serif; font-size: 2rem; color: var(--text-main);"><span data-key="projects_ongoing">On-Going Projects</span></h3>
            </div>
            <div id="projects-grid-ongoing" style="display: flex; flex-direction: column; gap: 3rem;">
                <!-- Projects loaded dynamically from projects.json -->
            </div>

        </section>
    </main>

    <footer>
        <div class="container text-center">
            <p data-key="footer_partners">Partners</p>
            <div class="partner-logos">
                <img src="source/logos/tudelft-logo.png" alt="TU Delft">
                <img src="source/logos/erasmus-logo.png" alt="Erasmus University">
                <img src="source/logos/rotterdam-logo.png" alt="Gemeente Rotterdam">
                <img src="source/logos/convergence-logo.png" alt="Convergence" style="height: 50px;">
            </div>
            <p style="margin-top: 3rem; color: var(--text-gray); font-size: 0.8rem;">&copy; 2026 SPARC. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Dynamically load projects from JSON
        (function() {
            var lang = localStorage.getItem("sparc_lang") || "en";

            
            
            function renderProjects(projects) {
                lang = localStorage.getItem("sparc_lang") || "en";
                var gridCompleted = document.getElementById("projects-grid-completed");
                var gridOngoing = document.getElementById("projects-grid-ongoing");
                if(gridCompleted) gridCompleted.innerHTML = "";
                if(gridOngoing) gridOngoing.innerHTML = "";

                for (var i = 0; i < projects.length; i++) {
                    var p = projects[i];
                    var row = document.createElement("div");
                    row.className = "project-row";
                    row.setAttribute("onclick", "window.location.href='project.html?id=" + p.id + "';");

                    var imgPath = "source/projects/" + p.id + "/image.png";
                    var fallbackImg = "rotterdam-skyline.png";
                    
                    var categoryHtml = '<span style="color: var(--primary-cyan); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 1px;">' + (p.category || "") + '</span>';
                    var badgeHtml = p.badge ? '<span style="display: inline-block; background: var(--primary-cyan); color: #111; padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-top: auto; align-self: flex-start; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">' + p.badge + '</span>' : '';

                    row.innerHTML = 
                        '<div class="project-left" style="background: linear-gradient(rgba(18,18,25,0.7), rgba(18,18,25,0.7)), url(\'' + fallbackImg + '\') no-repeat center center/cover; border-right: 1px solid var(--glass-border);" data-img="' + imgPath + '">' +
                            categoryHtml +
                            '<h3 style="color: #ffffff; margin: 0; font-size: 1.5rem; line-height: 1.3;">' + p["title_" + lang] + '</h3>' +
                            badgeHtml +
                        '</div>' +
                        '<div class="project-right">' +
                            '<p style="color: var(--text-gray); font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem;">' + p["desc_" + lang] + '</p>' +
                            '<span style="color: var(--primary-cyan); font-weight: 600; font-size: 0.95rem;">View Details &rarr;</span>' +
                        '</div>';

                    if (p.status === "ongoing") {
                        if(gridOngoing) gridOngoing.appendChild(row);
                    } else {
                        if(gridCompleted) gridCompleted.appendChild(row);
                    }

                    (function(rowEl, customImg) {
                        var testImg = new Image();
                        testImg.onload = function() {
                            var leftDiv = rowEl.querySelector(".project-left");
                            leftDiv.style.background = "linear-gradient(rgba(18,18,25,0.55), rgba(18,18,25,0.55)), url('" + customImg + "') no-repeat center center/cover";
                        };
                        testImg.src = customImg;
                    })(row, imgPath);
                }
            }
fetch("source/projects/projects.json")
                .then(function(r) { return r.json(); })
                .then(function(projects) {
                    renderProjects(projects);

                    // Override switchLang to re-render projects
                    var originalSwitchLang = window.switchLang;
                    window.switchLang = function(l) {
                        originalSwitchLang(l);
                        renderProjects(projects);
                    };
                });
        })();
    </script>
</body>

</html>
